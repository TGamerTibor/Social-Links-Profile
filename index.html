<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Social links profile</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <main>
    <article class="card">
      <div class="profile">
        <img src="./assets/images/avatar-jessica.jpeg" alt="Jessica Randall">
        <h1>Jessica Randall</h1>
        <p class="location">London, United Kingdom</p>
        <p class="bio">"Front-end developer and avid reader."</p>
      </div>

      <div class="social-links">
        <a href="https://github.com/jessicarandall" target="_blank" rel="noopener noreferrer">GitHub</a>
        <a href="https://www.frontendmentor.io/profile/jessicarandall" target="_blank" rel="noopener noreferrer">Frontend Mentor</a>
        <a href="https://www.linkedin.com/in/jessicarandall" target="_blank" rel="noopener noreferrer">LinkedIn</a>
        <a href="https://twitter.com/jessicarandall" target="_blank" rel="noopener noreferrer">Twitter</a>
        <a href="https://www.instagram.com/jessicarandall" target="_blank" rel="noopener noreferrer">Instagram</a>
      </div>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
